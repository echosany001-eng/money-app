<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D19">
<title>Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080D19;
    --card: #0F172A;
    --border: #1E2A44;
    --accent: #2563EB;
    --income: #10B981;
    --expense: #F87171;
    --text: #E8EEF8;
    --muted: #8FA0BC;
    --r-lg: 18px;
    --r-md: 16px;
    --r-sm: 14px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: var(--bg); }

  body {
    color: var(--text);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }

  button { font-family: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px calc(96px + env(safe-area-inset-bottom));
    min-height: 100dvh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .topbar h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .topbar .date { color: var(--muted); font-size: 13px; font-weight: 500; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 20px;
  }

  /* overview */
  .balance .label {
    color: var(--muted); font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 6px;
  }
  .balance .amount {
    font-size: 38px; font-weight: 800; letter-spacing: -0.03em; margin: 0;
  }
  .split { display: flex; gap: 16px; }
  .split > div { flex: 1; min-width: 0; }
  .split .k {
    color: var(--muted); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 3px;
  }
  .split .v { font-size: 18px; font-weight: 800; margin: 0; }

  .cats { display: grid; gap: 14px; }
  .cat-top {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 14px; margin-bottom: 7px;
  }
  .cat-name { font-weight: 600; }
  .cat-amt { font-weight: 700; white-space: nowrap; }
  .bar { height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 12px;
  }

  /* buttons */
  .btn {
    appearance: none;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 20px;
    min-height: 48px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { filter: brightness(0.95); }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn.danger { background: transparent; border: 1px solid rgba(248,113,113,0.5); color: var(--expense); }

  .placeholder {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 56px 20px;
  }
  .placeholder .big { font-size: 32px; margin-bottom: 8px; }

  /* transactions */
  .tx-list { display: grid; gap: 10px; }

  .tx {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 14px 16px;
    min-height: 60px;
  }
  .tx .icon {
    width: 40px; height: 40px; flex: 0 0 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800;
  }
  .tx.income .icon { background: rgba(16,185,129,0.14); color: var(--income); }
  .tx.expense .icon { background: rgba(248,113,113,0.14); color: var(--expense); }
  .tx .body { flex: 1; min-width: 0; }
  .tx .title {
    font-size: 15px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tx .meta { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .tx .amt { font-size: 16px; font-weight: 800; white-space: nowrap; }
  .tx .del {
    appearance: none; border: none; background: transparent; color: var(--muted);
    font-size: 20px; line-height: 1; width: 44px; height: 44px; flex: 0 0 44px;
    border-radius: 12px; cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .tx .del:hover { color: var(--expense); background: rgba(248,113,113,0.1); }

  .pos { color: var(--income); }
  .neg { color: var(--expense); }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 32px 16px;
    border: 1px dashed var(--border);
    border-radius: var(--r-md);
  }

  /* bottom nav */
  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    background: rgba(8,13,25,0.92);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .tabbar-inner {
    max-width: 520px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  }
  .tab {
    appearance: none; border: none; background: transparent; color: var(--muted);
    font-size: 11px; font-weight: 700;
    padding: 8px 4px; min-height: 52px;
    border-radius: 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .tab svg { width: 22px; height: 22px; display: block; }
  .tab.active { color: var(--accent); background: rgba(37,99,235,0.1); }

  /* floating add button */
  .fab {
    position: fixed;
    right: max(16px, calc((100vw - 520px) / 2 + 16px));
    bottom: calc(84px + env(safe-area-inset-bottom));
    z-index: 25;
    width: 60px; height: 60px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 32px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .fab:hover { filter: brightness(1.1); }
  .fab:active { transform: scale(0.94); }

  /* sheet */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(4,7,14,0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    max-width: 520px; margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(102%);
    transition: transform 0.24s ease;
  }
  .sheet.open { transform: translateY(0); }

  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .sheet-head h2 { font-size: 17px; font-weight: 800; margin: 0; }
  .sheet-close {
    appearance: none; border: none; background: transparent; color: var(--muted);
    font-size: 26px; line-height: 1; width: 44px; height: 44px; cursor: pointer;
    border-radius: 12px;
  }
  .sheet-close:hover { color: var(--text); }

  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 4px; margin-bottom: 16px;
  }
  .seg button {
    appearance: none; border: none; background: transparent; color: var(--muted);
    font-size: 14px; font-weight: 700; padding: 10px; min-height: 44px;
    border-radius: 11px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .seg button.active[data-type="expense"] { background: rgba(248,113,113,0.14); color: var(--expense); }
  .seg button.active[data-type="income"] { background: rgba(16,185,129,0.14); color: var(--income); }

  .amount-field {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 16px;
  }
  .amount-field .cur { font-size: 30px; font-weight: 800; color: var(--muted); }
  .amount-field input {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--text);
    font-size: 44px; font-weight: 800; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    padding: 4px 0;
  }
  .amount-field input::placeholder { color: #2E3A55; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    appearance: none; border: 1px solid var(--border); background: var(--bg);
    color: var(--muted); font-size: 14px; font-weight: 600;
    padding: 9px 14px; min-height: 40px; border-radius: 999px; cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: rgba(37,99,235,0.16); border-color: var(--accent); color: #fff; }

  .mini { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-bottom: 18px; }
  .mini input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--r-sm); color: var(--text); font-size: 15px;
    padding: 12px 14px; min-height: 46px; outline: none;
  }
  .mini input:focus { border-color: var(--accent); }
  .mini input::placeholder { color: #566A88; }

  .sheet .btn { width: 100%; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1 id="screen-title">Overview</h1>
      <span class="date" id="today"></span>
    </div>

    <section id="view-overview">
      <div class="card balance">
        <p class="label">Total balance</p>
        <p class="amount num" id="ov-balance">$0</p>
      </div>

      <p class="section-title" id="ov-month-label">This month</p>
      <div class="card">
        <div class="split">
          <div>
            <p class="k">Income</p>
            <p class="v pos num" id="ov-income">$0</p>
          </div>
          <div>
            <p class="k">Expenses</p>
            <p class="v neg num" id="ov-expense">$0</p>
          </div>
          <div>
            <p class="k">Net</p>
            <p class="v num" id="ov-net">$0</p>
          </div>
        </div>
      </div>

      <p class="section-title">Spending by category</p>
      <div class="card" id="ov-cats-card">
        <div class="cats" id="ov-cats"></div>
      </div>
    </section>

    <section id="view-operations" hidden>
      <div class="tx-list" id="tx-list"></div>
    </section>

    <section id="view-plans" hidden>
      <div class="placeholder">
        <div class="big">🎯</div>
        <p>Plans are coming in the next step.</p>
      </div>
    </section>

    <section id="view-more" hidden>
      <div class="placeholder">
        <div class="big">⋯</div>
        <p>More is coming in the next step.</p>
      </div>
    </section>
  </div>

  <button class="fab" id="fab" aria-label="Add transaction">+</button>

  <nav class="tabbar" aria-label="Main navigation">
    <div class="tabbar-inner">
      <button class="tab active" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Overview
      </button>
      <button class="tab" data-view="operations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Operations
      </button>
      <button class="tab" data-view="plans">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
        Plans
      </button>
      <button class="tab" data-view="more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        More
      </button>
    </div>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Add transaction">
    <div class="sheet-head">
      <h2>Add transaction</h2>
      <button class="sheet-close" id="sheet-close" aria-label="Close">×</button>
    </div>

    <div class="seg" id="type-seg">
      <button type="button" data-type="expense" class="active">Expense</button>
      <button type="button" data-type="income">Income</button>
    </div>

    <div class="amount-field">
      <span class="cur">$</span>
      <input id="q-amount" type="number" inputmode="numeric" step="1" min="0" placeholder="0" aria-label="Amount">
    </div>

    <div class="chips" id="q-chips"></div>

    <div class="mini">
      <input id="q-note" type="text" maxlength="60" placeholder="Note (optional)">
      <input id="q-date" type="date" aria-label="Date">
    </div>

    <button class="btn" id="q-save">Add expense</button>
  </div>

<script>
  (function () {
    "use strict";

    var DB_KEY = "money.v2";

    var CATEGORIES = {
      expense: ["Food", "Groceries", "Transport", "Shopping", "Bills", "Health", "Fun", "Home", "Other"],
      income: ["Salary", "Freelance", "Gift", "Refund", "Other"]
    };

    var SCREEN_TITLES = {
      overview: "Overview",
      operations: "Operations",
      plans: "Plans",
      more: "More"
    };

    function blank() {
      return { tx: [], budgets: [], goals: [], recurring: [], debts: [] };
    }

    var state = load();
    var currentView = "overview";
    var qType = "expense";
    var qCategory = null;

    function load() {
      try {
        var raw = localStorage.getItem(DB_KEY);
        if (!raw) return blank();
        var parsed = JSON.parse(raw);
        var base = blank();
        ["tx", "budgets", "goals", "recurring", "debts"].forEach(function (k) {
          if (Array.isArray(parsed[k])) base[k] = parsed[k];
        });
        return base;
      } catch (e) {
        return blank();
      }
    }

    function save() {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("Could not save:", e);
      }
    }

    function el(id) { return document.getElementById(id); }

    function money(n) { return "$" + Math.round(n).toLocaleString("en-US"); }

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    function todayISO() {
      var d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function formatDate(iso) {
      var p = iso.split("-");
      var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function sortedTx() {
      return state.tx.slice().sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return b.createdAt - a.createdAt;
      });
    }

    function renderOperations() {
      var list = el("tx-list");
      if (!state.tx.length) {
        list.innerHTML = '<div class="empty">No transactions yet. Tap + to add one.</div>';
        return;
      }
      list.innerHTML = "";
      sortedTx().forEach(function (t) {
        var row = document.createElement("div");
        row.className = "tx " + t.type;

        var icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = t.type === "income" ? "↑" : "↓";

        var body = document.createElement("div");
        body.className = "body";
        var title = document.createElement("div");
        title.className = "title";
        title.textContent = t.note || t.category;
        var meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = t.category + " · " + formatDate(t.date);
        body.appendChild(title);
        body.appendChild(meta);

        var amt = document.createElement("div");
        amt.className = "amt num " + (t.type === "income" ? "pos" : "neg");
        amt.textContent = (t.type === "income" ? "+" : "-") + money(t.amount);

        var del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.setAttribute("aria-label", "Delete");
        del.textContent = "×";
        del.addEventListener("click", function () {
          state.tx = state.tx.filter(function (x) { return x.id !== t.id; });
          save();
          renderAll();
        });

        row.appendChild(icon);
        row.appendChild(body);
        row.appendChild(amt);
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    function renderAll() {
      if (currentView === "operations") renderOperations();
      if (currentView === "overview") renderOverview();
      if (currentView === "plans") renderPlans();
      if (currentView === "more") renderMore();
    }

    function renderOverview() {
      var balance = 0;
      state.tx.forEach(function (t) {
        balance += t.type === "income" ? t.amount : -t.amount;
      });
      var balEl = el("ov-balance");
      balEl.textContent = money(balance);
      balEl.classList.toggle("pos", balance > 0);
      balEl.classList.toggle("neg", balance < 0);

      var mk = todayISO().slice(0, 7);
      var mIncome = 0, mExpense = 0, byCat = {};
      state.tx.forEach(function (t) {
        if (t.date.slice(0, 7) !== mk) return;
        if (t.type === "income") { mIncome += t.amount; }
        else { mExpense += t.amount; byCat[t.category] = (byCat[t.category] || 0) + t.amount; }
      });

      el("ov-income").textContent = money(mIncome);
      el("ov-expense").textContent = money(mExpense);
      var net = mIncome - mExpense;
      var netEl = el("ov-net");
      netEl.textContent = money(net);
      netEl.className = "v num " + (net > 0 ? "pos" : net < 0 ? "neg" : "");

      var parts = mk.split("-");
      var d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
      el("ov-month-label").textContent = d.toLocaleDateString("en-US", { month: "long", year: "numeric" });

      var cats = el("ov-cats");
      var entries = Object.keys(byCat).map(function (k) { return [k, byCat[k]]; })
        .sort(function (a, b) { return b[1] - a[1]; });

      if (!entries.length) {
        cats.innerHTML = '<div class="empty">No spending this month yet.</div>';
        return;
      }

      cats.innerHTML = "";
      var max = entries[0][1];
      entries.forEach(function (e) {
        var row = document.createElement("div");

        var top = document.createElement("div");
        top.className = "cat-top";
        var name = document.createElement("span");
        name.className = "cat-name";
        name.textContent = e[0];
        var amt = document.createElement("span");
        amt.className = "cat-amt num";
        amt.textContent = money(e[1]);
        top.appendChild(name);
        top.appendChild(amt);

        var bar = document.createElement("div");
        bar.className = "bar";
        var fill = document.createElement("i");
        fill.style.width = Math.max(4, Math.round(e[1] / max * 100)) + "%";
        bar.appendChild(fill);

        row.appendChild(top);
        row.appendChild(bar);
        cats.appendChild(row);
      });
    }
    function renderPlans() {}
    function renderMore() {}

    function renderNav(view) {
      currentView = view;
      ["overview", "operations", "plans", "more"].forEach(function (v) {
        el("view-" + v).hidden = v !== view;
      });
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (tab) {
        tab.classList.toggle("active", tab.getAttribute("data-view") === view);
      });
      el("screen-title").textContent = SCREEN_TITLES[view];
      renderAll();
    }

    /* ---------- quick add sheet ---------- */

    function renderChips() {
      var wrap = el("q-chips");
      wrap.innerHTML = "";
      CATEGORIES[qType].forEach(function (cat) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (cat === qCategory ? " active" : "");
        b.textContent = cat;
        b.addEventListener("click", function () {
          qCategory = cat;
          Array.prototype.forEach.call(wrap.children, function (c) {
            c.classList.toggle("active", c === b);
          });
        });
        wrap.appendChild(b);
      });
    }

    function setQType(type) {
      qType = type;
      qCategory = null;
      Array.prototype.forEach.call(el("type-seg").querySelectorAll("button"), function (b) {
        b.classList.toggle("active", b.getAttribute("data-type") === type);
      });
      el("q-save").textContent = type === "income" ? "Add income" : "Add expense";
      renderChips();
    }

    function openSheet() {
      setQType("expense");
      el("q-amount").value = "";
      el("q-note").value = "";
      el("q-date").value = todayISO();
      el("sheet-backdrop").classList.add("open");
      el("sheet").classList.add("open");
      setTimeout(function () { el("q-amount").focus(); }, 220);
    }

    function closeSheet() {
      el("sheet-backdrop").classList.remove("open");
      el("sheet").classList.remove("open");
    }

    function saveQuick() {
      var amount = Math.round(Number(el("q-amount").value));
      if (!amount || amount <= 0) { el("q-amount").focus(); return; }
      state.tx.push({
        id: uid(),
        type: qType,
        amount: amount,
        category: qCategory || "Other",
        note: el("q-note").value.trim(),
        date: el("q-date").value || todayISO(),
        createdAt: Date.now()
      });
      save();
      closeSheet();
      renderAll();
    }

    /* ---------- wiring ---------- */

    el("fab").addEventListener("click", openSheet);
    el("sheet-close").addEventListener("click", closeSheet);
    el("sheet-backdrop").addEventListener("click", closeSheet);
    el("q-save").addEventListener("click", saveQuick);
    el("type-seg").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-type]");
      if (b) setQType(b.getAttribute("data-type"));
    });
    el("q-amount").addEventListener("keydown", function (e) {
      if (e.key === "Enter") saveQuick();
    });
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (tab) {
      tab.addEventListener("click", function () { renderNav(tab.getAttribute("data-view")); });
    });

    el("today").textContent = new Date().toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    });
    renderNav("overview");
  })();
</script>
</body>
</html>
